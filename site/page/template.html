<meta charset="utf-8">
<title>The Castles of Dr. Creep in Zig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a strategy-guide spread. Sticky chapter index on the left, one
   long readable column on the right, coloured callout boxes keyed to the
   Comet 64's own palette, and the playable machine at the foot of each
   chapter. */
:root {
  --paper: #eef0f6;
  --sheet: #ffffff;
  --ink: #1d1b2e;
  --ink-soft: #4c4966;
  --rule: #d4d6e4;
  --accent: #352879;      /* the Comet's border blue */
  --accent-2: #6c5eb5;    /* light blue */
  --code-bg: #f4f4fa;
  --code-ink: #26233d;
  --tok-k: #6f3d86; --tok-t: #2b6f80; --tok-s: #5f6f12; --tok-n: #8a4a12;
  --tok-c: #7b7894; --tok-f: #352879; --tok-b: #9a3b2b;
  /* callout hues (Comet palette, tuned per theme) */
  --c-blue: #352879; --c-green: #3f7a2a; --c-yellow: #7a6a05; --c-cyan: #1f6f80;
  --c-purple: #6f3d86; --c-grey: #55525f; --c-red: #9a3b2b; --c-orange: #8a4a12;
  --c-brown: #6a4a20; --c-lblue: #5546a8;
  --tint: 7%;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111020; --sheet: #17162a; --ink: #e6e4f2; --ink-soft: #a9a6c4; --rule: #2e2c48;
    --accent: #a99cf0; --accent-2: #8a7de0; --code-bg: #0e0d1c; --code-ink: #dcdaf0;
    --tok-k: #d09ae8; --tok-t: #7fd0e0; --tok-s: #c3d27a; --tok-n: #e8a56a; --tok-c: #7f7c9c; --tok-f: #b5aaf5; --tok-b: #f08a74;
    --c-blue: #9d90f0; --c-green: #8fd07a; --c-yellow: #d8c860; --c-cyan: #72c8d8; --c-purple: #cf9ae6;
    --c-grey: #a6a3b8; --c-red: #f0907a; --c-orange: #f0a868; --c-brown: #d2a870; --c-lblue: #a99cf0;
    --tint: 12%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111020; --sheet: #17162a; --ink: #e6e4f2; --ink-soft: #a9a6c4; --rule: #2e2c48;
  --accent: #a99cf0; --accent-2: #8a7de0; --code-bg: #0e0d1c; --code-ink: #dcdaf0;
  --tok-k: #d09ae8; --tok-t: #7fd0e0; --tok-s: #c3d27a; --tok-n: #e8a56a; --tok-c: #7f7c9c; --tok-f: #b5aaf5; --tok-b: #f08a74;
  --c-blue: #9d90f0; --c-green: #8fd07a; --c-yellow: #d8c860; --c-cyan: #72c8d8; --c-purple: #cf9ae6;
  --c-grey: #a6a3b8; --c-red: #f0907a; --c-orange: #f0a868; --c-brown: #d2a870; --c-lblue: #a99cf0;
  --tint: 12%; color-scheme: dark;
}

html { scroll-padding-top: 16px; }
body { background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.65 var(--body); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, summary:focus-visible, canvas:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  padding-block: 28px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px;
  border-right: 1px solid var(--rule); background: var(--sheet);
  display: flex; flex-direction: column; gap: 22px;
}
.brand { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--ink); }
.brand-top { font: 400 .7rem/1 var(--display); letter-spacing: .14em; color: var(--ink-soft); }
.brand-name { font: 400 1.45rem/1.05 var(--display); color: var(--accent); }
.brand-sub { font: 600 .78rem/1.3 var(--mono); color: var(--ink-soft); }
.toc { display: flex; flex-direction: column; gap: 2px; }
.toc-item { display: grid; gap: 1px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); border-left: 3px solid transparent; }
.toc-item:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.toc-item[aria-current="page"] { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, transparent); }
.toc-num { font: 400 .66rem/1.2 var(--display); letter-spacing: .12em; color: var(--ink-soft); }
.toc-title { font-weight: 600; font-size: .95rem; line-height: 1.3; }
.toc-item.ref { margin-top: 10px; border-top: 1px dashed var(--rule); padding-top: 12px; }
.side-foot { margin-top: auto; font: .75rem/1.5 var(--mono); color: var(--ink-soft); }

main { padding-block: 40px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.view[hidden] { display: none; }
.view > * { min-width: 0; }
.view { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.chapter-head { display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; border-bottom: 4px solid var(--accent); }
.kicker { margin: 0; font: 400 .8rem/1 var(--display); letter-spacing: .16em; color: var(--ink-soft); }
.chapter-head h1 { margin: 0; font: 400 clamp(2rem, 6vw, 3.4rem)/1.02 var(--display); color: var(--accent); text-wrap: balance; }
.local { display: flex; flex-wrap: wrap; gap: 6px 14px; font: .8rem/1.4 var(--mono); }
.local a { color: var(--ink-soft); text-decoration: none; }
.local a:hover { color: var(--accent); text-decoration: underline; }

.prose { min-width: 0; }
.prose > * + * { margin-top: 1em; }
.prose h2 { font: 400 1.55rem/1.15 var(--display); color: var(--ink); margin-top: 2.2em; text-wrap: balance; }
.prose h3 { font: 600 1.2rem/1.3 var(--body); margin-top: 1.8em; }
.prose h4 { font: 600 1rem/1.3 var(--body); margin-top: 1.4em; }
.prose p, .prose li { max-width: 68ch; }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li + li { margin-top: .3em; }
.prose code { font: .86em/1.4 var(--mono); background: var(--code-bg); padding: .08em .3em; border-radius: 4px; color: var(--code-ink); }
.prose img { display: block; width: 100%; max-width: 768px; image-rendering: pixelated; border-radius: 6px; box-shadow: 0 0 0 1px var(--rule); }
.prose blockquote { margin-left: 0; padding-left: 1em; border-left: 3px solid var(--rule); color: var(--ink-soft); }
.prose > pre, .box-body > pre { overflow-x: auto; padding: 12px 14px; background: var(--code-bg); border-radius: 8px; font: .8rem/1.5 var(--mono); color: var(--code-ink); }
.prose hr { border: 0; border-top: 1px solid var(--rule); }
.prose table { border-collapse: collapse; font-size: .9rem; display: block; overflow-x: auto; max-width: 100%; }
.prose th, .prose td { border-bottom: 1px solid var(--rule); padding: 6px 10px; text-align: left; vertical-align: top; }
.prose th { font: 400 .72rem/1.2 var(--display); letter-spacing: .08em; color: var(--ink-soft); }
.prose td { font-variant-numeric: tabular-nums; }

.code { position: relative; background: var(--code-bg); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--rule); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: .82rem/1.55 var(--mono); color: var(--code-ink); }
.code pre code { background: none; padding: 0; font: inherit; }
.code .lang { position: absolute; top: 6px; right: 10px; font: .62rem/1 var(--display); letter-spacing: .1em; color: var(--tok-c); text-transform: uppercase; }
.code.snippet { box-shadow: inset 0 0 0 1px var(--rule); background: transparent; }
.code.snippet pre { border-left: 3px dashed var(--rule); }
.k, .kd, .kn, .kr { color: var(--tok-k); font-weight: 600; }
.kt, .nc { color: var(--tok-t); }
.s, .s1, .s2, .sc, .se, .sb { color: var(--tok-s); }
.m, .mi, .mh, .mb, .mf, .mo, .kc { color: var(--tok-n); }
.c, .c1, .cm, .cs, .sd { color: var(--tok-c); font-style: italic; }
.nf, .fm { color: var(--tok-f); }
.nb, .bp { color: var(--tok-b); }
.o, .p { color: var(--code-ink); }

.box { --hue: var(--c-blue); border-radius: 10px; background: color-mix(in srgb, var(--hue) var(--tint), var(--sheet)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--hue) 45%, transparent); padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.box-head, .box > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.box-label { font: 400 .78rem/1 var(--display); letter-spacing: .12em; color: var(--sheet); background: var(--hue); padding: 5px 8px 4px; border-radius: 4px; text-transform: uppercase; }
.box-title { font-weight: 600; font-size: 1.02rem; }
.box-body > * + * { margin-top: .8em; }
.box-body > :first-child { margin-top: 0; }
.box-body p, .box-body li { max-width: none; }
.box-mission-briefing { --hue: var(--c-blue); padding: 20px 22px 22px; }
.box-mission-briefing .box-label { font-size: .9rem; }
.box-power-up { --hue: var(--c-green); }
.box-byte-budget { --hue: var(--c-yellow); }
.box-pro-tip { --hue: var(--c-cyan); }
.box-under-the-hood { --hue: var(--c-purple); }
.box-secret-passage { --hue: var(--c-grey); }
.box-game-over { --hue: var(--c-red); }
.box-warp-zone { --hue: var(--c-lblue); }
.box-boss-battle { --hue: var(--c-orange); }
.box-bonus-stage { --hue: var(--c-green); }
.box-inside-the-disk { --hue: var(--c-brown); }
.box-type-in { --hue: var(--c-grey); }
.box-type-in > summary { cursor: pointer; list-style: none; }
.box-type-in > summary::-webkit-details-marker { display: none; }
.box-type-in > summary::after { content: "Show listing"; margin-left: auto; font: .75rem/1 var(--mono); color: var(--ink-soft); }
.box-type-in[open] > summary::after { content: "Hide listing"; }

.play { border-radius: 14px; background: var(--sheet); box-shadow: 0 0 0 1px var(--rule); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.play-head { display: flex; flex-direction: column; gap: 6px; }
.play-eyebrow { font: 400 .72rem/1 var(--display); letter-spacing: .14em; color: var(--ink-soft); }
.play-title { margin: 0; font: 400 1.4rem/1.1 var(--display); color: var(--accent); }
.play-note { margin: 0; color: var(--ink-soft); font-size: .92rem; max-width: 62ch; }
.crt { position: relative; background: #352879; padding: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 384 / 272; max-width: 100%; }
.crt canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; background: #352879; }
.power { position: absolute; inset: 0; margin: auto; width: max-content; height: max-content; font: 400 1rem/1 var(--display); letter-spacing: .1em; color: #352879; background: #b8c76f; border: 0; border-radius: 8px; padding: 14px 22px 12px; cursor: pointer; box-shadow: 0 4px 0 #6f4f25; }
.power:hover { background: #c9d880; }
.power:active { transform: translateY(2px); box-shadow: 0 2px 0 #6f4f25; }
.play-status { margin: 0; font: .78rem/1.4 var(--mono); color: var(--ink-soft); min-height: 1.4em; }

.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid var(--rule); }
.pager a { font: 400 .85rem/1.3 var(--display); letter-spacing: .04em; text-decoration: none; }
.pager .next { margin-left: auto; text-align: right; }

.mobile-bar { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mobile-bar { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
  .mobile-bar .brand-name { font-size: 1rem; }
  .mobile-bar select { margin-left: auto; min-width: 0; max-width: 60%; font: 600 .9rem var(--body); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
  main { padding-block: 24px 64px; }
}
{{DIAGRAM_CSS}}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="mobile-bar">
  <span class="brand-name">Dr. Creep in Zig</span>
  <label for="chapter-select" hidden>Chapter</label>
  <select id="chapter-select"></select>
</div>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#prologue">
      <span class="brand-top">The Castles of</span>
      <span class="brand-name">Dr. Creep</span>
      <span class="brand-sub">written in Zig, for the Comet 64</span>
    </a>
    <nav class="toc" aria-label="Chapters">
{{NAV}}
    </nav>
    <p class="side-foot">64 KB · 50 Hz · 8 sprites · 19,656 cycles a frame</p>
  </aside>
  <main>
{{VIEWS}}
  </main>
</div>

<script type="module">
const views = [...document.querySelectorAll(".view")];
const navItems = [...document.querySelectorAll(".toc-item")];
const select = document.getElementById("chapter-select");
for (const a of navItems) {
  const o = document.createElement("option");
  o.value = a.dataset.view;
  o.textContent = a.querySelector(".toc-num").textContent + ": " + a.querySelector(".toc-title").textContent;
  select.append(o);
}
select.addEventListener("change", () => { location.hash = select.value; });

const running = new Map(); // view -> comet
function show(name) {
  if (!views.some((v) => v.dataset.view === name)) name = "prologue";
  for (const v of views) {
    const on = v.dataset.view === name;
    v.hidden = !on;
    const comet = running.get(v.dataset.view);
    if (comet) on ? comet.resume() : comet.pause();
  }
  for (const a of navItems) {
    if (a.dataset.view === name) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  select.value = name;
  try { localStorage.setItem("creep-view", name); } catch {}
}
function route(scroll) {
  let name = location.hash.slice(1);
  if (!name) { try { name = localStorage.getItem("creep-view") || ""; } catch {} }
  show(name || "prologue");
  if (scroll) window.scrollTo(0, 0);
}
addEventListener("hashchange", () => route(true));
route(false);

// In-chapter jumps scroll without touching the hash (the hash names the chapter).
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-jump]");
  if (!a) return;
  e.preventDefault();
  document.getElementById(a.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" });
});

// Power on a checkpoint when asked; only the visible chapter's machine runs.
document.addEventListener("click", async (e) => {
  const btn = e.target.closest(".power");
  if (!btn) return;
  const play = btn.closest(".play");
  const canvas = play.querySelector("canvas");
  const status = play.querySelector("[data-status]");
  const view = btn.closest(".view").dataset.view;
  btn.disabled = true;
  status.textContent = "Powering on…";
  try {
    const { startComet } = await import("./shell.js");
    const comet = await startComet(canvas, { wasm: canvas.dataset.wasm, status });
    running.set(view, comet);
    btn.remove();
    canvas.focus();
    status.textContent = "Running. Click the screen if the keys stop answering.";
  } catch (err) {
    btn.disabled = false;
    status.textContent = "This checkpoint didn't load. Reload the page and try again.";
    console.error(err);
  }
});
</script>
