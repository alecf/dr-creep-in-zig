<style>
.ch10-env svg { width: 100%; max-width: 520px; }
.ch10-env .wave { stroke: var(--accent); stroke-width: 2.5; fill: none; }
.ch10-env .fillw { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
.ch10-env .gate { stroke: var(--c13); stroke-width: 2.5; fill: none; }
.ch10-env .tick { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.ch10-env text { font-size: 12px; }
.ch10-env .small { font-size: 10.5px; }
</style>
<div class="ch10-env">
  <span class="dg-label">One note's loudness: the gate starts it, and letting go ends it</span>
  <svg viewBox="0 0 520 230" role="img" aria-label="The envelope: loudness climbs during attack, falls to the sustain level during decay, holds while the gate is on, and falls to silence during release after the gate goes off.">
    <path class="fillw" d="M40 160 L100 30 L170 85 L350 85 L450 160 Z"/>
    <path class="wave" d="M40 160 L100 30 L170 85 L350 85 L450 160"/>
    <line class="line" x1="40" y1="160" x2="490" y2="160"/>
    <line class="line" x1="40" y1="20" x2="40" y2="160"/>
    <line class="tick" x1="100" y1="30" x2="100" y2="200"/>
    <line class="tick" x1="170" y1="85" x2="170" y2="200"/>
    <line class="tick" x1="350" y1="85" x2="350" y2="200"/>
    <line class="tick" x1="450" y1="160" x2="450" y2="200"/>
    <line class="tick" x1="40" y1="85" x2="170" y2="85"/>
    <text x="34" y="34" text-anchor="end" class="small soft">full</text>
    <text x="34" y="89" text-anchor="end" class="small soft">sustain</text>
    <text x="34" y="164" text-anchor="end" class="small soft">0</text>
    <text x="70" y="184" text-anchor="middle">attack</text>
    <text x="135" y="184" text-anchor="middle">decay</text>
    <text x="260" y="184" text-anchor="middle">sustain</text>
    <text x="400" y="184" text-anchor="middle">release</text>
    <path class="gate" d="M10 220 L40 220 L40 202 L350 202 L350 220 L500 220"/>
    <text x="195" y="216" text-anchor="middle" class="small soft">gate on</text>
    <text x="425" y="216" text-anchor="middle" class="small soft">gate off</text>
  </svg>
  <small>Attack, decay and release are times, 4 bits each. Sustain is a level, from 0 (silence) to 15 (full).</small>
</div>
