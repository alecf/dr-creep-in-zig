<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comet 64</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #111114; color: #9a9aa2;
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  main { text-align: center; padding: 16px; }
  canvas {
    display: block; margin: 0 auto;
    width: min(calc(100vw - 32px), 1152px); aspect-ratio: 384 / 272;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; outline: none;
    border-radius: 6px; box-shadow: 0 0 0 1px #2a2a30;
  }
  canvas:focus-visible { box-shadow: 0 0 0 2px #6c5eb5; }
  p { margin: 12px 0 0; }
  kbd {
    background: #1c1c22; border: 1px solid #34343c; border-radius: 3px;
    padding: 0 5px; color: #d0d0d6;
  }
</style>
</head>
<body>
<main>
  <canvas data-comet="game.wasm" width="384" height="272" tabindex="0" autofocus></canvas>
  <p data-comet-status>Powering on…</p>
  <p>
    Joystick 1: <kbd>arrows</kbd> or <kbd>WASD</kbd> + <kbd>space</kbd> ·
    Joystick 2: <kbd>IJKL</kbd> + <kbd>enter</kbd> · click the screen to play (and to hear it) · <kbd>tab</kbd> lets go of the keyboard
  </p>
  <p>
    <label hidden>Slot in a disk: <input type="file" accept=".d64" data-comet-disk hidden></label>
    <button type="button" data-comet-save-disk hidden>Save the disk</button>
  </p>
</main>
<script type="module" src="shell.js"></script>
</body>
</html>
